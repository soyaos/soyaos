# Owner: release-eng
# Purpose: Cross-compile soyaos for 6 editions × 5 platforms (solo subset active in alpha)
# Trigger: push to main, pull_request, manual. Release assets are built by release.yml.
# Notes: Requires GITHUB_TOKEN (auto). Drop the `solo`-only `if` to activate full matrix.

name: matrix-build

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      module_release_pr:
        description: Simulate pending module tags for a generated release PR
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.edition }} ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [solo, cluster, cloud, hybrid, ent-cloud, ent-private]
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - name: Checkout
        if: matrix.edition == 'solo'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        if: matrix.edition == 'solo'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Prepare pending module tags
        if: matrix.edition == 'solo' && github.event_name == 'workflow_dispatch' && inputs.module_release_pr
        run: |
          python3 scripts/module_release.py local-tags --base-ref origin/main
          git config --global protocol.file.allow always
          git config --global url."file://${GITHUB_WORKSPACE}/".insteadOf "https://github.com/soyaos/soyaos"
          echo 'GIT_ALLOW_PROTOCOL=file:https:http:ssh:git' >> "${GITHUB_ENV}"
          echo 'GONOPROXY=github.com/soyaos/soyaos/*' >> "${GITHUB_ENV}"
          echo 'GONOSUMDB=github.com/soyaos/soyaos/*' >> "${GITHUB_ENV}"
          echo 'GOPROXY=https://proxy.golang.org,direct' >> "${GITHUB_ENV}"

      - name: Build
        if: matrix.edition == 'solo'
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          out="dist/soyaos-${{ matrix.edition }}-${{ matrix.os }}-${{ matrix.arch }}${ext}"
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags='-s -w' \
            -tags edition_${{ matrix.edition }} \
            -o "${out}" \
            ./cmd/soyaos

      - name: Upload artifact
        if: matrix.edition == 'solo'
        uses: actions/upload-artifact@v4
        with:
          name: soyaos-${{ matrix.edition }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/soyaos-${{ matrix.edition }}-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error
          retention-days: 14
