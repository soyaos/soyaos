name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      module_release_pr:
        description: Simulate pending module tags for a generated release PR
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.23.x']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare pending module tags
        if: github.event_name == 'workflow_dispatch' && inputs.module_release_pr
        run: |
          python3 scripts/module_release.py local-tags --base-ref origin/main
          git config --global protocol.file.allow always
          git config --global url."file://${GITHUB_WORKSPACE}/".insteadOf "https://github.com/soyaos/soyaos"
          echo 'GIT_ALLOW_PROTOCOL=file:https:http:ssh:git' >> "${GITHUB_ENV}"
          echo 'GONOPROXY=github.com/soyaos/soyaos/*' >> "${GITHUB_ENV}"
          echo 'GONOSUMDB=github.com/soyaos/soyaos/*' >> "${GITHUB_ENV}"
          echo 'GOPROXY=https://proxy.golang.org,direct' >> "${GITHUB_ENV}"
          echo 'GOTOOLCHAIN=local' >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Verify workspace topology
        run: |
          test ! -e go.mod
          test "$(go list -m | wc -l | tr -d ' ')" = "26"
          test "$(find cmd pkg -mindepth 2 -maxdepth 2 -name go.mod | wc -l | tr -d ' ')" = "26"

      - name: Test module release planner
        run: python3 -m unittest scripts/test_module_release.py

      - name: Verify module tidiness
        run: make tidy-check

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go test workspace
        run: make test

      - name: go test independent modules
        run: make test-independent

      - name: go build
        run: make build

      - name: docker build
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg GITSHA="${GITHUB_SHA::12}" \
            -t soyaos:ci .
