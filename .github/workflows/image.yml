# Owner: release-eng
# Purpose: Build multi-arch container images and publish to ghcr.io/soyaos
# Trigger: push of v* tags, or manual workflow_dispatch
# Notes: Requires GITHUB_TOKEN (auto). Dockerfile at repo root is TODO for alpha.

name: image

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          ref="${{ github.ref_name }}"
          tags="ghcr.io/soyaos/soyaos:${ref}"
          # latest only when ref looks like a release tag (vX.Y.Z, no pre-release suffix)
          if [[ "${ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags},ghcr.io/soyaos/soyaos:latest"
          fi
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      # TODO: requires repo-root Dockerfile (alpha defers this).
      - name: Build and push
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: false
