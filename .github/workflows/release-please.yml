# Owner: release-eng
# Purpose: PR-driven changelog/tagging followed by the reusable publish pipeline.
# Trigger: push to main. A newly-created release invokes release.yml directly,
# because events created with GITHUB_TOKEN do not start another workflow run.

name: release-please

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  statuses: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Dispatch protected checks for release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/dispatch_protected_checks.sh?ref=${GITHUB_SHA}" \
            --jq .content \
            | base64 --decode \
            > /tmp/dispatch_protected_checks.sh
          chmod +x /tmp/dispatch_protected_checks.sh
          while IFS= read -r branch; do
            /tmp/dispatch_protected_checks.sh "${branch}" false
          done < <(jq -r '.[].headBranchName' <<< "${RELEASE_PRS}")

  publish:
    name: publish release assets and image
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}
    secrets: inherit
